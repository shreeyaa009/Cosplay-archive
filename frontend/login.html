<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login ♡ Cosplay Archive</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Pacifico&family=Varela+Round&family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="auth-page">

        <!-- Floating decorations -->
        <div class="auth-floating-decorations">
            <span class="auth-float float-1">♡</span>
            <span class="auth-float float-2">✦</span>
            <span class="auth-float float-3">🌸</span>
            <span class="auth-float float-4">✨</span>
            <span class="auth-float float-5">🎀</span>
            <span class="auth-float float-6">♡</span>
        </div>

        <!-- Main card -->
        <main class="auth-card">

            <div class="auth-sticker-wrap">
                <img
                    src="https://i.pinimg.com/736x/31/ab/a6/31aba6b19f86ae88cf682eb5f07e886b.jpg"
                    alt="Cute anime character"
                    class="auth-sticker"
                    onerror="this.style.display='none';"
                >
            </div>

            <div class="auth-heading">
                <span class="auth-mini-title">♡ Welcome back ♡</span>

                <h1>
                    Welcome Back!
                </h1>

                <p>
                    Log in to continue your cosplay journey ✨
                </p>
            </div>

            <form id="loginForm" class="auth-form">

                <div class="auth-field">
                    <label for="loginIdentifier">
                        Username
                    </label>

                    <div class="auth-input-wrap">
                        <span class="auth-input-icon">♡</span>

                        <input
                            type="text"
                            id="loginIdentifier"
                            name="identifier"
                            placeholder="your username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <small class="field-error" id="identifierError"></small>
                </div>


                <div class="auth-field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="auth-input-wrap">
                        <span class="auth-input-icon">🔒</span>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                            aria-label="Show password"
                        >
                            ♡
                        </button>
                    </div>

                    <small class="field-error" id="passwordError"></small>

                </div>


                <div class="auth-message" id="loginMessage"></div>


                <button
                    type="submit"
                    class="auth-submit"
                    id="loginButton"
                >
                    <span>🎀</span>
                    <span>Log In</span>
                    <span>♡</span>
                </button>

            </form>


            <div class="auth-divider">
                <span>✦</span>
                <div></div>
                <span>♡</span>
                <div></div>
                <span>✦</span>
            </div>


            <p class="auth-switch">
                Don't have an account?

                <a href="signup.html">
                    Create one ♡
                </a>
            </p>


            <a href="index.html" class="back-home">
                ← Back to Cosplay Archive
            </a>

        </main>

    </div>

    <script src="auth.js"></script>

</body>
</html>
